version: 2
models:
  - name: silver_locale_evidence_coverage
    description: Observed evidence counts by instrument, requested locale, platform and explicit window before brand expansion. This does not count unsupported files never parsed or expected collections.
    columns:
      - name: source_category
        tests: [not_null]
      - name: observation_count
        description: Distinct parsed observation identifiers; not independent samples or total raw files.
        tests: [not_null]
      - name: language_code
        description: Requested language normalized to lowercase hyphenated codes; null is unknown.
      - name: location_code
        description: Provider location identifier; not an inferred country or confirmed personalization.
      - name: collection_status
        tests: [not_null]